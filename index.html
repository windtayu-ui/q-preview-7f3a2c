对比 7 月 10 日那次，你是让她"写口算"，没说写多少、也没说写完怎么样。她磨了一小时。

这四句的共同点是每一句都从上一句推出来，中间没有需要额外解释的跳跃。`,refs:["9月22日 汇报的顺序问题"]}]},"i:agentic":{title:"带新人这件事",context:"9 条记录 · 已挂载",opening:'这 9 条里你提了三次"先扔个小活"，但没定过什么活合适。要不要现在定一下？',suggestions:["帮我挑几个","为什么讲了他记不住","哪些活不能给"],turns:[{who:"me",v:"帮我挑几个"},{who:"ai",v:`从你这 9 条里能提出三条标准：

一、错了不要紧——返工成本自己能兜住。
二、有明确的对错——他自己能看出来做没做对，不用等你判。
三、做完能用上你讲过的那一块——不然还是两回事。

第一条是最硬的筛子。按它检验：整理上个月的门店反馈、把三份报价做成一张对照表、跟一次样品到仓，这几个都合适。而对外发的品类报告不行，错了要重发，压力压到他身上反而学不到。`,refs:["9月14日 做错一次比我讲十遍管用","8月19日 写了文档给他，他没看"]}]},"i:coffee":{title:"咖啡这件事",context:"11 条记录 · 已挂载",opening:"11 条里你记过 6 种豆子，但没写过最喜欢哪一支。要不要现在挑一个？",suggestions:["帮我挑一支","我的口味偏什么","参数还要不要抠"],turns:[{who:"me",v:"我的口味偏什么"},{who:"ai",v:`从你记的参数看，你一直在 92 度和 1:15 附近调，这个组合出的是偏厚、酸度收着的风格。

但你 6 月之后的三条都在写"要等""不想事"，一条参数都没记。所以口味可能不是你真正在意的——你在意的是那个过程。

如果是这样，挑豆子的标准可以换：不挑风味描述，挑磨起来手感好的、香气散得慢的。`,refs:["2月9日 92 度出的酸味更明显","6月28日 手冲比意式有意思"]}]},"i:house":{title:"该不该换个离学校近的房子",context:"6 条记录 · 已挂载",opening:'你没写过"如果不搬，有没有别的办法把那两小时补回来"。要不要先想这个？',suggestions:["不搬有别的办法吗","帮我列个对比","我到底在犹豫什么"],turns:[{who:"me",v:"我到底在犹豫什么"},{who:"ai",v:`你前四条在算钱（一平贵一万二、够不够首付），后两条在算时间（两小时、三小时里占不到一小时）。

这两套账不能互相换算，所以你一直下不了决定——不是信息不够，是没确定用哪把尺子。

9 月 6 日那条你其实已经给了答案："这么一算就不是贵不贵的问题了。" 但你没往下写。`,refs:["7月3日 学区那边一平贵一万二","9月6日 两小时换的是陪她的时间"]}]},"t:robot-iv":{title:"收纳用品访谈",context:"5 位受访者 · 2 小时 6 分录音 · 已挂载",opening:"老用户和半年内的新用户关注点完全不同，下一轮要不要分开招募？",suggestions:["两类人差在哪","下一轮怎么招募","哪条洞察最站得住"],turns:[{who:"me",v:"两类人差在哪"},{who:"ai",v:`四位老用户（一年以上）关心的都是拿取顺不顺手——要开盖的、要摞起来的、看不见里面的，最后都空着。第 5 位（半年）还在关注能装多少。

差别的原因是容量这件事在买回来之后就不再被感知了，天天发生的是"拿一下、放回去"。所以复购的决定因素会从能装多少挪到放回去省不省事。

如果下一轮还混着招，两类人的诉求会互相抵消，得不出结论。`,refs:["第 3 位 · 20:15","第 5 位"]}]},"t:note-iv":{title:"厨房小家电访谈",context:"7 位受访者 · 4 小时 12 分录音 · 已挂载",opening:"五个人都说清洗麻烦，但没有一个人在买之前问过这件事。要不要顺着这条往下想？",suggestions:["他们为什么买之前不问","第 6 位跟其他人的差别","下一轮该问什么"],turns:[{who:"me",v:"第 6 位跟其他人的差别"},{who:"ai",v:`第 6 位（租房过渡）跟其他六位的差别是：他不是嫌麻烦不用，他是一开始就没打算长期用。原话是"搬家的时候只留了最小那台，其他都送人了"。

其他六位的问题都在"想用但嫌麻烦"，他的问题在"不觉得这东西要跟着自己走"。

这两种人要的东西不一样：前者需要少一道拆洗工序，后者需要的是便携和好处理。如果按前者做，第 6 位这类人不会被打动。`,refs:["第 6 位 · 21:12","第 7 位 · 08:12"]}]},"c:pm":{title:"认知心理学",context:"这一门课 8 讲 · 已挂载",opening:"第 8 讲的作业是记一周自己的遗忘曲线，你还没做。要不要现在把这周的先补上？",suggestions:["第 8 讲讲了什么","帮我把作业过一遍","哪几讲我还没听完"],turns:[{who:"me",v:"第 8 讲讲了什么"},{who:"ai",v:`第 8 讲讲的是记忆的编码与提取，三块：

一、遗忘曲线怎么看——老师强调看它在第几天拍平，不是看第一天掉了多少。
二、深加工要能用自己的话讲出来，不能是"我看过好几遍"这种熟悉感。
三、提取线索在存进去的时候就定了，事后再补很难。

作业是记一周自己的遗忘曲线。你录音里 52 分钟那段老师举了个反例，可以对着听一遍。`,refs:["第 8 讲 · 12:30 遗忘曲线","第 8 讲 · 52:04 反复朗读的反例"]}]},"c:research":{title:"访谈与提问方法",context:"这一门课 6 讲 · 已挂载",opening:"你这两组访谈的提纲都是自己拟的，跟课上讲的结构不太一样。要不要对一遍？",suggestions:["课上的提纲结构是什么","我的提纲差在哪","怎么问才不引导"],turns:[{who:"me",v:"我的提纲差在哪"},{who:"ai",v:`课上讲的结构是：先问最近一次的具体经历，再问当时怎么做的，最后才问为什么。你的提纲是倒过来的，第一个问题就是"你觉得这类产品最大的问题是什么"。
